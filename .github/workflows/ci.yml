name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 22.18.0 is the supported floor (type stripping on by default); 22 and 24 track the latest releases.
        node: ['22.18.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test the built CLI
        shell: bash
        env:
          HIVEMEM_HOME: ${{ runner.temp }}/hivemem
        run: |
          node dist/cli/main.js remember "CI smoke test" --as user
          node dist/cli/main.js brief | grep -q "CI smoke test"
